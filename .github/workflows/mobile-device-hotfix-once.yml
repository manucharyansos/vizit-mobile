name: Mobile device hotfix (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch booking dates and local times
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          book = 'src/app/book/[slug].tsx'
          replace_required(
              book,
              "import { guestBookingStore } from '@/services/guest-booking-store';\n",
              "import { guestBookingStore } from '@/services/guest-booking-store';\nimport { formatApiTime, localDateKey, localDateTimeInputFromApi } from '@/services/date-time';\n",
          )
          replace_required(
              book,
              "const localDate = (days = 0) => {\n  const date = new Date();\n  date.setDate(date.getDate() + days);\n  const offset = date.getTimezoneOffset() * 60000;\n  return new Date(date.getTime() - offset).toISOString().slice(0, 10);\n};\nconst time = (value: string) => value.slice(11, 16);\n\n",
              "",
          )
          replace_required(book, "const [date, setDate] = useState(localDate(1));", "const [date, setDate] = useState(localDateKey(0));")
          replace_required(book, "const dates = useMemo(() => Array.from({ length: 10 }, (_, index) => localDate(index + 1)), []);", "const dates = useMemo(() => Array.from({ length: 10 }, (_, index) => localDateKey(index)), []);")
          replace_required(book, "starts_at: slot!.starts_at.slice(0, 16),", "starts_at: localDateTimeInputFromApi(slot!.starts_at),")
          replace_required(book, "label={`${time(item.starts_at)}–${time(item.ends_at)}`}", "label={`${formatApiTime(item.starts_at, locale)}–${formatApiTime(item.ends_at, locale)}`}")

          bookings = 'src/app/(customer)/bookings.tsx'
          replace_required(
              bookings,
              'import { checkoutUrlFrom, openIdBankCheckout } from "@/services/payments";\n',
              'import { checkoutUrlFrom, openIdBankCheckout } from "@/services/payments";\nimport { formatApiDateTime, formatApiTime, localDateKey, localDateKeyFromApi, localDateTimeInputFromApi } from "@/services/date-time";\n',
          )
          replace_required(
              bookings,
              'value={booking.starts_at ?? booking.start_at ?? "—"}',
              'value={formatApiDateTime(booking.starts_at ?? booking.start_at, locale)}',
          )
          replace_required(
              bookings,
              '}) {\n  const { theme } = useApp();\n  const [date, setDate] = useState(() => {\n    const value = new Date();\n    value.setDate(value.getDate() + 1);\n    return value.toISOString().slice(0, 10);\n  });',
              '}) {\n  const { theme, locale } = useApp();\n  const [date, setDate] = useState(() => localDateKeyFromApi(booking.starts_at) ?? localDateKey(0));',
          )
          replace_required(bookings, 'starts_at: selected!.starts_at.slice(0, 16),', 'starts_at: localDateTimeInputFromApi(selected!.starts_at),')
          replace_required(bookings, '{slot.starts_at.slice(11, 16)}', '{formatApiTime(slot.starts_at, locale)}')

          profile = 'src/app/(customer)/profile.tsx'
          replace_required(
              profile,
              'import { VizitIcon } from "@/components/vizit-icon";\n',
              'import { VizitIcon } from "@/components/vizit-icon";\nimport { formatApiDateTime } from "@/services/date-time";\n',
          )
          replace_required(profile, '<Text style={{ color: theme.muted }}>{item.starts_at}</Text>', '<Text style={{ color: theme.muted }}>{formatApiDateTime(item.starts_at, locale)}</Text>')
          PY
      - name: Commit hotfix when needed
        run: |
          git config user.name "vizit-ci"
          git config user.email "88939484+manucharyansos@users.noreply.github.com"
          git add src/app/book/'[slug].tsx' src/app/'(customer)'/bookings.tsx src/app/'(customer)'/profile.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: correct mobile booking dates and local times"
            git push origin HEAD:main
          fi
