name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Android Expo bundle
        run: npx expo export --platform android --output-dir dist/android --clear

      - name: iOS Expo bundle
        run: npx expo export --platform ios --output-dir dist/ios --clear

      - name: Build source archive
        run: zip -rq vizit-mobile-source.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'vizit-mobile-source.zip'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: vizit-mobile-source
          path: vizit-mobile-source.zip
          if-no-files-found: error
          retention-days: 14
