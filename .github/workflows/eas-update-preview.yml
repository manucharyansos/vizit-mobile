name: Publish Preview OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: Manual preview update

permissions:
  contents: read

concurrency:
  group: preview-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish preview update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check EXPO_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency check
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Publish preview OTA
        run: eas update --channel preview --environment preview --message "${{ inputs.message }}" --non-interactive
