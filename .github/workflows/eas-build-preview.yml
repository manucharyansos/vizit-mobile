name: Build Preview APK

on:
  workflow_dispatch:
    inputs:
      existing_build_id:
        description: Optional EAS build ID to follow instead of starting another build
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: preview-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 26.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Wait for the installable Android preview
        env:
          EXISTING_BUILD_ID: ${{ inputs.existing_build_id }}
        run: node scripts/eas-preview-build.cjs
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vizit-preview-apk
          path: |
            artifacts/vizit-preview.apk
            artifacts/preview-build.json
          if-no-files-found: error
          retention-days: 14
