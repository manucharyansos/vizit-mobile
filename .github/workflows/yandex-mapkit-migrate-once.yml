name: Yandex MapKit dependency migration (one-time)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm install
      - name: Replace legacy Yandex wrapper
        run: |
          npm install expo-yandex-mapkit@2.23.0 --save
          npm uninstall react-native-yamap
      - name: Commit dependency files when needed
        run: |
          git config user.name "vizit-ci"
          git config user.email "88939484+manucharyansos@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: migrate to Expo Yandex MapKit"
            git push origin HEAD:main
          fi
